name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build and model assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /tmp/scry-model-cache
          key: ${{ runner.os }}-scry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-scry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare pinned model cache
        run: cargo run --quiet --locked --package scry-benchmarks -- --cache /tmp/scry-model-cache --prepare-cache

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Check v1 benchmark baseline
        run: cargo run --quiet --locked --package scry-benchmarks -- --cache /tmp/scry-model-cache --check benchmarks/baseline-v1.json
